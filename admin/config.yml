# Sveltia CMS — https://sveltiacms.app/en/docs
# Sign in at /photos/admin/ with "Sign In with Token": a fine-grained GitHub
# token with access to willchambers/photos, Contents: Read and write. See README.md.

backend:
  name: github
  repo: willchambers/photos
  branch: main
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

site_url: https://willchambers.github.io/photos/
display_url: https://willchambers.github.io/photos/

# Content stores photos as "/assets/uploads/…" (no /photos/ prefix); the build
# adds the prefix to every link. Photostream writes the same paths.
media_folder: src/assets/uploads
public_folder: /assets/uploads

# Photos are converted to WebP and capped at 2400px on the long side before
# they're committed, so phone photos don't bloat the repo. The build then
# makes smaller copies for the wall.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2400
        height: 2400
    max_file_size: 26214400

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: photos
    label: Photos
    label_singular: Photo set
    description: One or more photos with a shared title, date and topics. They all appear on the photo wall. Photostream posts land here too.
    folder: src/photos
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, required: false, hint: "A sentence or two about the photos. Shown in the photo viewer and in Photostream." }
      - { label: Date, name: date, widget: datetime }
      - { label: Location, name: location, widget: string, required: false }
      - { label: Topics, name: topics, widget: list, required: false, hint: "Comma-separated. Used for the filter buttons on the wall." }
      - label: Photos
        name: images
        widget: list
        min: 1
        summary: "{{fields.caption}}"
        fields:
          - { label: Photo, name: image, widget: image }
          - { label: Alt text, name: alt, widget: string, hint: "Describe the photo for people who can't see it." }
          - { label: Caption, name: caption, widget: string, required: false }

  - name: site
    label: Site
    files:
      - name: profile
        label: Page text
        file: src/_data/profile.yml
        fields:
          - { label: Headline, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text }
